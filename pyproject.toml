[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "net-lease-ownership-intelligence"
version = "0.1.0"
description = "Fictional property ownership reconciliation portfolio POC"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.64,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
